<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>KPP AgroAsia CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
body{font-family:'Sarabun',sans-serif;background:#f5f5f0;margin:0}
.scrollbar-hide::-webkit-scrollbar{display:none}
.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;
const load=(k,d=[])=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});

const USERS=[
  {id:'u1',name:'Admin',username:'ADMIN',password:'Kppadmin',role:'admin',avatar:'AD'},
  {id:'u2',name:'Sales 01',username:'Sales01',password:'Sales0123',role:'sales',avatar:'S1'},
  {id:'u3',name:'Sales 02',username:'Sales02',password:'Saleskpp2363',role:'sales',avatar:'S2'},
];

const PROVINCES=['กระบี่','กาญจนบุรี','กาฬสินธุ์','กำแพงเพชร','ขอนแก่น','จันทบุรี','ฉะเชิงเทรา','ชลบุรี','ชัยนาท','ชัยภูมิ','ชุมพร','เชียงราย','เชียงใหม่','ตรัง','ตราด','ตาก','นครนายก','นครปฐม','นครพนม','นครราชสีมา','นครศรีธรรมราช','นครสวรรค์','นนทบุรี','นราธิวาส','น่าน','บึงกาฬ','บุรีรัมย์','ปทุมธานี','ประจวบคีรีขันธ์','ปราจีนบุรี','ปัตตานี','พระนครศรีอยุธยา','พะเยา','พังงา','พัทลุง','พิจิตร','พิษณุโลก','เพชรบุรี','เพชรบูรณ์','แพร่','ภูเก็ต','มหาสารคาม','มุกดาหาร','แม่ฮ่องสอน','ยโสธร','ยะลา','ร้อยเอ็ด','ระนอง','ระยอง','ราชบุรี','ลพบุรี','ลำปาง','ลำพูน','เลย','ศรีสะเกษ','สกลนคร','สงขลา','สตูล','สมุทรปราการ','สมุทรสงคราม','สมุทรสาคร','สระแก้ว','สระบุรี','สิงห์บุรี','สุโขทัย','สุพรรณบุรี','สุราษฎร์ธานี','สุรินทร์','หนองคาย','หนองบัวลำภู','อ่างทอง','อำนาจเจริญ','อุดรธานี','อุตรดิตถ์','อุทัยธานี','อุบลราชธานี'];

function LoginScreen({onLogin}){
  const [u,setU]=useState('');
  const [p,setP]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const doLogin=()=>{
    if(!u||!p){setErr('กรุณากรอก Username และ Password');return}
    setLoading(true);
    setTimeout(()=>{
      const user=USERS.find(x=>x.username===u&&x.password===p);
      if(user)onLogin(user);
      else{setErr('Username หรือ Password ไม่ถูกต้อง');setLoading(false)}
    },500);
  };
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#064e3b,#1c1917)',padding:'1rem'}}>
      <div style={{width:'100%',maxWidth:'360px'}}>
        <div style={{textAlign:'center',marginBottom:'2rem'}}>
          <div style={{width:64,height:64,background:'#059669',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 1rem',fontSize:28,fontWeight:700,color:'#fff'}}>K</div>
          <h1 style={{color:'#fff',fontSize:22,fontWeight:600,margin:0}}>KPP AgroAsia</h1>
          <p style={{color:'#6ee7b7',fontSize:14,marginTop:4}}>ระบบ CRM & Route Sales</p>
        </div>
        <div style={{background:'#fff',borderRadius:20,padding:24,boxShadow:'0 25px 50px rgba(0,0,0,0.3)'}}>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:12,fontWeight:500,color:'#78716c',display:'block',marginBottom:4}}>Username</label>
            <input value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLogin()}
              style={{width:'100%',border:'1px solid #e7e5e4',borderRadius:12,padding:'10px 12px',fontSize:14,boxSizing:'border-box',outline:'none'}}
              placeholder="กรอก Username..."/>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:12,fontWeight:500,color:'#78716c',display:'block',marginBottom:4}}>Password</label>
            <input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLogin()}
              style={{width:'100%',border:'1px solid #e7e5e4',borderRadius:12,padding:'10px 12px',fontSize:14,boxSizing:'border-box',outline:'none'}}
              placeholder="กรอก Password..."/>
          </div>
          {err&&<div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:'8px 12px',fontSize:12,color:'#dc2626',marginBottom:12}}>{err}</div>}
          <button onClick={doLogin} disabled={loading}
            style={{width:'100%',background:'#059669',color:'#fff',border:'none',borderRadius:12,padding:'11px',fontSize:14,fontWeight:600,cursor:'pointer',opacity:loading?0.6:1}}>
            {loading?'กำลังเข้าสู่ระบบ...':'เข้าสู่ระบบ'}
          </button>
        </div>
        <p style={{textAlign:'center',color:'#78716c',fontSize:12,marginTop:16}}>KPP AgroAsia CRM v4.0</p>
      </div>
    </div>
  );
}

/* (content omitted for brevity in command) */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
